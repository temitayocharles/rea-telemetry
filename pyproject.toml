[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetrycraft"
version = "1.0.0"
description = "One lightweight telemetry stack: metrics, logs, traces, errors, alerting, incidents, SLOs and synthetics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TelemetryCraft contributors" }]
keywords = ["observability", "prometheus", "promql", "grafana", "opentelemetry", "sre", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
telemetrycraft = "craft.cli:main"
craft = "craft.cli:main"

[project.urls]
Homepage = "https://github.com/temitayocharles/rea-telemetry"

[tool.setuptools]
packages = ["craft"]

[tool.setuptools.package-data]
craft = ["web/*", "web/**/*"]
